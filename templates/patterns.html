<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Patterns</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Patterns trouvés</h1>
    <form method="get" action="{{ url_for('patterns') }}" style="margin-bottom:12px;">
      <label>min_support:
        <input type="number" name="min_support" min="0" max="1" step="0.01" value="{{ min_support if min_support is defined else 0.1 }}">
      </label>
      &nbsp;
      <label>min_confidence:
        <input type="number" name="min_confidence" min="0" max="1" step="0.01" value="{{ min_confidence if min_confidence is defined else 0.6 }}">
      </label>
      <button type="submit">Appliquer</button>
    </form>
    {% if patterns %}
      <table>
        <thead><tr><th>Règle</th><th>Support</th><th>Confidence</th></tr></thead>
        <tbody>
        {% for p in patterns %}
          <tr>
            <td>{{ p.rule }}</td>
            <td>{{ p.support }}</td>
            <td>{{ p.confidence }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>Aucun pattern trouvé (essayez d'abaisser `min_support` ou `min_confidence`).</p>
    {% endif %}

    <h2>Decision Tree (règles)</h2>
    <pre style="background:#111;color:#0f0;padding:10px;border-radius:6px;">
{{ tree_rules }}
    </pre>

    <p><a href="/">Retour</a></p>
  </div>
</body>
</html>
