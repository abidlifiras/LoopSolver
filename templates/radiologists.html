<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Radiologues</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Radiologues</h1>
    <h2>Ajouter</h2>
    <form method="post">
      <label>Nom: <input name="name" required></label><br>
      <label>Email: <input name="email"></label><br>
      <label>Spécialité: <input name="specialty" value="general"></label><br>
      <label>Disponible: <select name="available"><option value="1">Oui</option><option value="0">Non</option></select></label><br>
      <button type="submit">Ajouter</button>
    </form>

    <h2>Liste</h2>
    {% if radiologists %}
      <table>
        <thead><tr><th>id</th><th>nom</th><th>email</th><th>specialty</th><th>available</th></tr></thead>
        <tbody>
        {% for r in radiologists %}
          <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.name }}</td>
            <td>{{ r.email }}</td>
            <td>{{ r.specialty }}</td>
            <td>{{ r.available }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>Aucun radiologue trouvé.</p>
    {% endif %}

    <p><a href="/">Retour</a></p>
  </div>
</body>
</html>
